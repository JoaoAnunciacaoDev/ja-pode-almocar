<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#f8f4ee;font-family:Arial,sans-serif;color:#25231f">
    <div style="max-width:600px;margin:0 auto;padding:32px 18px">
      <div style="background:#fff;border-radius:24px;padding:32px;box-shadow:0 8px 30px rgba(52,45,35,.08)">
        <p style="margin:0 0 8px;color:#df5d3f;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase">Já pode almoçar?</p>
        <p style="margin:0 0 18px;color:#8b857b;font-size:14px;font-style:italic">Desculpa a ansiedade, mas… já pode confirmar seu e-mail?</p>
        <h1 style="margin:0 0 16px;font-size:26px;line-height:1.2">Confirme seu cadastro</h1>
        <p style="margin:0 0 22px;line-height:1.6;color:#625d54">Só falta confirmar seu endereço de e-mail para começar a combinar os horários das refeições com seu grupo.</p>
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;border-radius:999px;background:#df5d3f;color:#fff;padding:13px 20px;text-decoration:none;font-weight:700">Confirmar meu e-mail</a>
        <p style="margin:22px 0 0;line-height:1.5;color:#8b857b;font-size:12px">Se você não criou esta conta, pode ignorar esta mensagem.</p>
      </div>
    </div>
  </body>
</html>
